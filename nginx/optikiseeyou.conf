# ==============================================================================
# Nginx Hardened Production Configuration for optikiseeyou.com
# Target Domain: optikiseeyou.com (Origin Server Hardening)
# Security Standard: CIS Nginx Benchmark / OWASP Secure Configuration
# ==============================================================================

# Rate Limiting Zones (Mitigate automated bot probing, scrapers & brute force)
limit_req_zone $binary_remote_addr zone=isy_req_limit:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=isy_conn_limit:10m;

# Upstream Next.js Node.js Server
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name optikiseeyou.com www.optikiseeyou.com;

    # Allow Let's Encrypt ACME challenge verification
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://optikiseeyou.com$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.optikiseeyou.com;

    ssl_certificate /etc/letsencrypt/live/optikiseeyou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/optikiseeyou.com/privkey.pem;

    return 301 https://optikiseeyou.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name optikiseeyou.com;

    # SSL Configuration (TLS 1.2 and 1.3 only, modern secure ciphers)
    ssl_certificate /etc/letsencrypt/live/optikiseeyou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/optikiseeyou.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security: Hide Nginx banner/version
    server_tokens off;

    # Connection & Request Limits
    limit_req zone=isy_req_limit burst=25 nodelay;
    limit_conn isy_conn_limit 20;

    # ==========================================================================
    # Global Security Headers
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-DNS-Prefetch-Control "on" always;
    add_header Content-Security-Policy "default-src 'self' https://optikiseeyou.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: https://*.r2.dev https://*.cloudflarestorage.com https://res.cloudinary.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.r2.dev https://*.cloudflarestorage.com https://res.cloudinary.com https://cdn.jsdelivr.net https://*.peerjs.com wss://*.peerjs.com https://fonts.googleapis.com https://fonts.gstatic.com https://storage.googleapis.com data: blob:; media-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://api.whatsapp.com https://wa.me; frame-src 'self' https://www.google.com https://maps.google.com; frame-ancestors 'none'; upgrade-insecure-requests;" always;

    # Client payload restrictions
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # ==========================================================================
    # CRITICAL: Blocking Access to Sensitive Files, Backups & Environment Files
    # ==========================================================================

    # 1. Deny access to hidden dot-files and folders (.git, .env, .htaccess, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 2. Deny access to database files (.sql, .sqlite, .db) & archives (.tar.gz, .zip, .bak)
    location ~* \.(sql|sqlite|sqlite3|db|bak|backup|old|orig|save|swp|tmp|temp|dump)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 3. Deny access to archives, logs & sensitive config files
    location ~* \.(tar|gz|tgz|zip|rar|7z|bz2|log|conf|config|ini|sh|bash|env.*|yml|yaml|md5|sha1)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 4. Deny access to package metadata & lock files
    location ~* (package\.json|package-lock\.json|tsconfig\.json|composer\.json|composer\.lock)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ==========================================================================
    # API Routes & Sensitive Dynamic Endpoints: Cache-Control Hardening
    # ==========================================================================
    location /api/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Anti-cache for sensitive transaction/API endpoints
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Static Assets Caching (.next/static, public images)
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /wasm/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Cross-Origin-Opener-Policy "same-origin";
    }

    # Main Application Proxy
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
